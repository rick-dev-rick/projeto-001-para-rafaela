<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Você ❤️</title>

    <link rel="stylesheet" href="pagina2.css">
</head>

<body>

<main class="pagina">

    <header class="cabecalho">

        <h1>Para você, Rafaela ❤️</h1>

        <p>
            Algumas coisas bonitas precisam florescer...
        </p>

    </header>


    <!-- ================================= -->
    <!-- 🌸 FLOR DE LUZ -->
    <!-- ================================= -->

    <section class="jardim">

        <div class="flor">

            <!-- Aura principal -->
            <div class="aura aura-1"></div>
            <div class="aura aura-2"></div>
            <div class="aura aura-3"></div>


            <!-- Partículas luminosas -->

            <div class="particula particula-1">✦</div>
            <div class="particula particula-2">✦</div>
            <div class="particula particula-3">•</div>
            <div class="particula particula-4">✦</div>
            <div class="particula particula-5">•</div>
            <div class="particula particula-6">✦</div>
            <div class="particula particula-7">•</div>
            <div class="particula particula-8">✦</div>


            <!-- ================================= -->
            <!-- PÉTALAS EXTERNAS -->
            <!-- ================================= -->

            <div class="petala petala-externa p1"></div>
            <div class="petala petala-externa p2"></div>
            <div class="petala petala-externa p3"></div>
            <div class="petala petala-externa p4"></div>
            <div class="petala petala-externa p5"></div>
            <div class="petala petala-externa p6"></div>
            <div class="petala petala-externa p7"></div>
            <div class="petala petala-externa p8"></div>


            <!-- ================================= -->
            <!-- PÉTALAS INTERNAS -->
            <!-- ================================= -->

            <div class="petala petala-interna i1"></div>
            <div class="petala petala-interna i2"></div>
            <div class="petala petala-interna i3"></div>
            <div class="petala petala-interna i4"></div>
            <div class="petala petala-interna i5"></div>
            <div class="petala petala-interna i6"></div>


            <!-- ================================= -->
            <!-- CENTRO -->
            <!-- ================================= -->

            <div class="centro">

                <div class="centro-brilho"></div>

                <div class="centro-nucleo">
                    ❤️
                </div>

            </div>


            <!-- ================================= -->
            <!-- CAULE -->
            <!-- ================================= -->

            <div class="caule"></div>

            <div class="caule-brilho"></div>


            <!-- ================================= -->
            <!-- FOLHAS -->
            <!-- ================================= -->

            <div class="folha folha-esquerda">

                <span></span>

            </div>

            <div class="folha folha-direita">

                <span></span>

            </div>

        </div>

    </section>


    <!-- ================================= -->
    <!-- MENSAGEM -->
    <!-- ================================= -->

    <section class="mensagem">

        <h2>
            E assim nasceu uma pequena parte
            da nossa história. ❤️
        </h2>

        <p>
            Assim como essa flor,
            nosso amor continua crescendo
            todos os dias.
        </p>

        <p class="assinatura">
            Eu te amo, Rafaela. ❤️
        </p>

    </section>


    <!-- ================================= -->
    <!-- PRÓXIMA PÁGINA -->
    <!-- ================================= -->

    <div class="proximo">

        <a href="pagina3.html">
            📸 Nossas memórias
        </a>

    </div>

</main>


<footer>

    <p>
        Feito por Rick_dev, com amor. ❤️
    </p>

</footer>

</body>

</html>
